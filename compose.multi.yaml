# Multi-replica check: three identical app instances share one database,
# like HPA replicas. Usage: make docker-multi && make docker-multi-check
services:
  app:
    environment: &multi-env
      DATABASE_URL: postgresql+psycopg://${PR_BATCH_DB_USER:-batch}:${PR_BATCH_DB_PASSWORD:-batch-local-only}@postgres:5432/${PR_BATCH_DB_NAME:-batch}
      STORAGE_ROOT: /workspace/shared
      AUTH_MODE: header
      EXECUTOR_BASE_URL: ${PR_BATCH_EXECUTOR_URL:-http://executor:8000}
      SYNC_INITIAL_SECONDS: "2"
      SYNC_MAX_SECONDS: "5"
      # Short lease so recovery after a frozen/killed replica is observable.
      TASK_LEASE_SECONDS: "30"
      DB_AUTO_MIGRATE: "true"
  app-2:
    extends:
      file: compose.yaml
      service: app
    ports: !reset []
    environment: *multi-env
  app-3:
    extends:
      file: compose.yaml
      service: app
    ports: !reset []
    environment: *multi-env
