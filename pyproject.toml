[project]
name = "pr-batch"
version = "0.1.0"
description = "Batch service project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
error-on-warning = true

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
