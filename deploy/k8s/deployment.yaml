# One repo = one Deployment, one container per pod: this container serves
# the API and runs the scheduler and task dispatcher (src/app/runtime).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-batch
  labels:
    app.kubernetes.io/name: pr-batch
spec:
  # HPA owns the replica count; keep >= 2 so schedules survive a pod loss.
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pr-batch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pr-batch
    spec:
      automountServiceAccountToken: false
      # SIGTERM: stop claiming, finish in-flight calls (<= 40s), exit.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pr-batch
          # CI/CD replaces this with the immutable image built from this repo.
          image: pr-batch:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: BATCH_STORAGE_ROOT
              value: /workspace/shared
            - name: BATCH_EXECUTOR_BASE_URL
              value: http://executor:8000
            - name: BATCH_DB_AUTO_MIGRATE
              value: "true"
            # Connection budget: (3 + 3) per pod x maxReplicas 4 = 24.
            - name: BATCH_DB_POOL_SIZE
              value: "3"
            - name: BATCH_DB_MAX_OVERFLOW
              value: "3"
            - name: BATCH_TASK_CONCURRENCY
              value: "4"
            - name: BATCH_SYNC_INITIAL_SECONDS
              value: "5"
            - name: BATCH_SYNC_MAX_SECONDS
              value: "60"
            - name: BATCH_SHUTDOWN_GRACE_SECONDS
              value: "40"
          envFrom:
            - secretRef:
                name: pr-batch-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60  # migrations may hold the advisory lock
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            # Fails when the background loops stall, so the pod restarts.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: shared
              mountPath: /workspace/shared
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: executor-shared  # RWX volume shared with Executor
        - name: tmp
          emptyDir: {}
