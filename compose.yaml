# Local pr-batch stack on top of the Executor repository's split Compose:
#   shared-infra       PostgreSQL·Redis (network: shared-infra)
#   executor-runtimes  Jupyter INTERACTIVE/BATCH runtimes
#   executor           Executor API (alias "executor" on shared-infra)
# Start those first, then: make docker-up
name: pr-batch

x-batch-env: &batch-env
  DATABASE_URL: postgresql+psycopg://${PR_BATCH_DB_USER:-batch}:${PR_BATCH_DB_PASSWORD:-batch-local-only}@postgres:5432/${PR_BATCH_DB_NAME:-batch}
  # Same host directory the Executor mounts as INPUT_STORAGE_ROOT.
  STORAGE_ROOT: /workspace/shared
  # Local key pair from `make auth-keys`, mounted below; the smoke checks
  # sign with its private half.
  AUTH_PUBLIC_KEY_FILE: .local-keys/auth_public.pem
  AUTH_ISSUER: batch-client
  AUTH_AUDIENCE: batch-service
  EXECUTOR_BASE_URL: ${PR_BATCH_EXECUTOR_URL:-http://executor:8000}
  SYNC_INITIAL_SECONDS: ${PR_BATCH_SYNC_INITIAL_SECONDS:-2}
  SYNC_MAX_SECONDS: ${PR_BATCH_SYNC_MAX_SECONDS:-10}
  DB_AUTO_MIGRATE: "true"

x-batch-app: &batch-app
  image: pr-batch:local
  environment: *batch-env
  volumes:
    - ${EXECUTOR_SHARED_DIR:-../executor/shared_dir}:/workspace/shared
    - ./.local-keys:/app/.local-keys:ro
  networks:
    - shared-infra
  restart: unless-stopped

services:
  db-init:
    image: pgvector/pgvector:pg17
    entrypoint: ["/bin/sh", "/init-db.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${SHARED_POSTGRES_ADMIN_USER:-executor}
      PGPASSWORD: ${SHARED_POSTGRES_ADMIN_PASSWORD:-executor}
      PGDATABASE: ${SHARED_POSTGRES_ADMIN_DB:-executor}
      BATCH_DB_USER: ${PR_BATCH_DB_USER:-batch}
      BATCH_DB_PASSWORD: ${PR_BATCH_DB_PASSWORD:-batch-local-only}
      BATCH_DB_NAME: ${PR_BATCH_DB_NAME:-batch}
    volumes:
      - ./docker/init-db.sh:/init-db.sh:ro
    networks:
      - shared-infra
    restart: "no"

  # Same shape as production: one container serves the API and runs the
  # scheduler and task dispatcher; it migrates the schema on startup.
  app:
    <<: *batch-app
    build:
      context: .
    ports:
      - "${PR_BATCH_PORT:-8100}:8000"
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      db-init:
        condition: service_completed_successfully

  # End-to-end check: make docker-smoke
  smoke:
    <<: *batch-app
    command: ["python", "scripts/docker_smoke.py"]
    environment:
      <<: *batch-env
      SMOKE_API_URL: http://app:8000
    profiles: ["smoke"]
    depends_on:
      app:
        condition: service_healthy
    restart: "no"

networks:
  shared-infra:
    external: true
    name: ${SHARED_INFRA_NETWORK:-shared-infra}
