# Shared by every environment and read even without APP_ENV (local runs
# too); config.{APP_ENV}.yml overrides a key, environment variables and
# .env of the same name override both. Keys are Settings field names.
HOST: 0.0.0.0
# Listen port; keep deploy/k8s containerPort in step.
PORT: 8000
# Callers send X-Api-Key; config.{APP_ENV}.yml lists them (AUTH_CLIENTS).
UPLOAD_MAX_BYTES: 10485760
MAX_CODE_CELLS: 100
# All cells (markdown and raw too); keep at least MAX_CODE_CELLS.
MAX_NOTEBOOK_CELLS: 1000
CELL_MAX_BYTES: 1048576
DB_AUTO_MIGRATE: true
# Swagger (/docs, /redoc) and the OpenAPI schema: on by default (local runs
# and the local Docker stack). Internal network rules keep it off in dev, stg
# and prd: config.{dev,stg,prd}.yml set it to false.
DOCS_ENABLED: true
# Schema path, used only while DOCS_ENABLED is true; unset serves no docs.
OPENAPI_URL: /openapi.json
# Per pod: 4 background loops plus API requests share this pool.
# Connection budget: (2 + 4) per pod x maxReplicas 2 = 12.
DB_POOL_SIZE: 2
DB_MAX_OVERFLOW: 4
# Kernels of the Executor BATCH pool that batches may choose.
BATCH_RUNTIMES:
  - {type: JUPYTER, profile: default}
  - {type: JUPYTER, profile: "3102311"}
TASK_CONCURRENCY: 2
IDLE_MAX_SECONDS: 1
TASK_LEASE_SECONDS: 90
SYNC_INITIAL_SECONDS: 5
SYNC_MAX_SECONDS: 60
SHUTDOWN_GRACE_SECONDS: 40
TASK_GIVE_UP_SECONDS: 86400
# A batch whose schedule admission fails is retried after this long, up
# to the limit; then its due occurrences are skipped (SCHEDULER_ERROR).
SCHEDULE_RETRY_SECONDS: 300
SCHEDULE_RETRY_LIMIT: 3
IDEMPOTENCY_RETENTION_DAYS: 7
TASK_RETENTION_DAYS: 30
