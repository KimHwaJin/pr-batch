# Standard logging.dictConfig used when the internal HCP library is absent.
# Inside the company network HCP's init_logger() reads its own logger.yml;
# replace this file with that one when moving the code in.
version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s %(levelname)s %(name)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout

root:
  level: INFO
  handlers: [console]

loggers:
  app:
    level: INFO
  # uvicorn keeps its own handlers with propagate off unless reset here.
  uvicorn:
    handlers: []
    propagate: true
  uvicorn.error:
    handlers: []
    propagate: true
  uvicorn.access:
    level: INFO
    handlers: []
    propagate: true
