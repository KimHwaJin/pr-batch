name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: batch_test
          POSTGRES_PASSWORD: batch_test_local
          POSTGRES_DB: pr_batch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BATCH_TEST_DATABASE_URL: postgresql+psycopg://batch_test:batch_test_local@localhost:5432/pr_batch_test
      BATCH_DATABASE_URL: postgresql+psycopg://batch_test:batch_test_local@localhost:5432/pr_batch_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: make setup
      - name: Run static checks and PostgreSQL tests
        run: make check
      - name: Check migration and model agreement
        run: uv run --locked alembic check
